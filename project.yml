name: Sanchr
options:
  bundleIdPrefix: com.sanchr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  grpc-swift:
    url: https://github.com/grpc/grpc-swift.git
    exactVersion: "1.27.5"
  swift-protobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: "1.36.1"
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: "146.0.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    exactVersion: "8.8.1"
  GRDB:
    url: https://github.com/ZynclaveTech/GRDB.swift.git
    exactVersion: "7.10.0-zynclave.1"

targets:
  LibSignalClient:
    type: framework
    platform: iOS
    sources:
      - path: Vendor/LibSignal/Sources/LibSignalClient
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.sanchr.libsignal
        PRODUCT_NAME: LibSignalClient
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Vendor/LibSignal/Headers"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/LibSignal/Headers"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(inherited) $(SRCROOT)/Vendor/LibSignal/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(inherited) $(SRCROOT)/Vendor/LibSignal/simulator"
        OTHER_LDFLAGS: "$(inherited) -lsignal_ffi -lc++"
        APPLICATION_EXTENSION_API_ONLY: false
        DEFINES_MODULE: true
        SKIP_INSTALL: true
        BUILD_LIBRARY_FOR_DISTRIBUTION: false

  SanchrShared:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SanchrShared
    dependencies:
      - package: GRDB
        product: GRDBSQLCipher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.sanchr.shared
        PRODUCT_NAME: SanchrShared
        DEFINES_MODULE: YES
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_BITCODE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  Sanchr:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Platform
      - path: Shared
      - path: Features
      - path: Generated
      - path: Resources/Assets.xcassets
    resources:
      - path: Resources/Fonts
    dependencies:
      - target: LibSignalClient
      - target: SanchrShared
      - package: grpc-swift
        product: GRPC
      - package: swift-protobuf
        product: SwiftProtobuf
      - package: WebRTC
        product: WebRTC
      - package: Kingfisher
        product: Kingfisher
      - package: GRDB
        product: GRDBSQLCipher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.sanchr.app
        PRODUCT_NAME: Sanchr
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        CODE_SIGN_ENTITLEMENTS: Sanchr.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sanchr-Bridging-Header.h"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Vendor/LibSignal/Headers"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/LibSignal/Headers $(SRCROOT)/Platform/Crypto/VyncOPRF"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(inherited) $(SRCROOT)/Vendor/LibSignal/device $(SRCROOT)/Vendor/VyncPSI/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(inherited) $(SRCROOT)/Vendor/LibSignal/simulator $(SRCROOT)/Vendor/VyncPSI/simulator"
        OTHER_LDFLAGS: "$(inherited) -lsignal_ffi -lvync_psi -lc++"
    preBuildScripts:
      - name: AttachmentPicker import hygiene
        script: '"${SRCROOT}/Scripts/check-attachment-picker-imports.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sanchr
        CFBundleName: Sanchr
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
          - fetch
          - processing
          - voip
        BGTaskSchedulerPermittedIdentifiers:
          - com.sanchr.sync.messages
          - com.sanchr.sync.refresh
        NSContactsUsageDescription: "Sanchr needs access to your contacts to find friends who use the app."
        NSCameraUsageDescription: "Sanchr needs camera access for video calls and photos."
        NSMicrophoneUsageDescription: "Sanchr uses the microphone for voice messages and calls."
        NSPhotoLibraryUsageDescription: "Sanchr needs photo library access to share photos and videos."
        NSFaceIDUsageDescription: "Use Face ID to unlock Sanchr."
        NSLocationWhenInUseUsageDescription: "Sanchr uses your location only when you tap to share it in a chat. Coordinates are end-to-end encrypted and never sent to Sanchr servers."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Sanchr.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains: []

  SanchrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: Sanchr
      - target: LibSignalClient
      - package: GRDB
        product: GRDBSQLCipher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Vendor/LibSignal/Headers"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/LibSignal/Headers"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(inherited) $(SRCROOT)/Vendor/LibSignal/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(inherited) $(SRCROOT)/Vendor/LibSignal/simulator"
        OTHER_LDFLAGS: "$(inherited) -lsignal_ffi -lc++"

  SanchrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Sanchr
      - package: GRDB
        product: GRDBSQLCipher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
