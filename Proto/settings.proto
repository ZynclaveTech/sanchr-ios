syntax = "proto3";
package sanchr.settings;

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (UserSettings);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UserSettings);
  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse);
  rpc ToggleSanchrMode(ToggleSanchrModeRequest) returns (UserSettings);
  rpc GetStorageUsage(GetStorageUsageRequest) returns (StorageUsageResponse);
  // Fetch the encrypted profile of one or more users by id. The only way a
  // client obtains a peer's profile ciphertext when that peer is not in its
  // address book — a conversation started by phone number or QR code. The
  // server returns opaque blobs; only a holder of the matching Profile Key
  // can read them.
  rpc GetUserProfiles(GetUserProfilesRequest) returns (GetUserProfilesResponse);
  rpc SetRegistrationLock(SetRegistrationLockRequest) returns (SetRegistrationLockResponse);
}

message GetSettingsRequest {}

message UserSettings {
  bool read_receipts = 1;
  bool online_status_visible = 2;
  bool typing_indicator = 3;
  string profile_photo_visibility = 4;
  bool sanchr_mode_enabled = 5;
  bool screen_lock_enabled = 6;
  int32 screen_lock_timeout = 7;
  bool screenshot_protection = 8;
  bool biometric_lock = 9;
  bool message_notifications = 10;
  bool group_notifications = 11;
  bool call_notifications = 12;
  string notification_sound = 13;
  bool notification_vibrate = 14;
  bool show_preview = 15;
  string theme = 16;
  string font_size = 17;
  string chat_wallpaper = 18;
  string auto_download_wifi = 19;
  string auto_download_mobile = 20;
  string auto_download_roaming = 21;
  bool low_data_mode = 22;
  bool registration_lock_enabled = 23;
}

message UpdateSettingsRequest {
  UserSettings settings = 1;
}

message UpdateProfileRequest {
  string display_name = 1;
  string avatar_url   = 2;
  string status_text  = 3;
  // field 4 reserved — formerly profile_key. The Profile Key is distributed
  // to contacts over the Signal session (content type "profile-key/v1"),
  // never through the server, which also holds the ciphertext it protects.
  reserved 4;
  bytes encrypted_display_name  = 5;
  bytes encrypted_bio           = 6;
  bytes encrypted_avatar_url    = 7;
  // Short hash of the Profile Key the three ciphertexts above were made with.
  // Stored verbatim and echoed back so a client can tell whether the server's
  // ciphertext still matches the key it currently holds.
  bytes profile_key_version     = 8;
}

message ProfileResponse {
  string id           = 1;
  string display_name = 2;
  string avatar_url   = 3;
  string status_text  = 4;
  // field 5 reserved — formerly profile_key. The Profile Key is distributed
  // to contacts over the Signal session (content type "profile-key/v1"),
  // never through the server, which also holds the ciphertext it protects.
  reserved 5;
  bytes encrypted_display_name  = 6;
  bytes encrypted_bio           = 7;
  bytes encrypted_avatar_url    = 8;
  bytes profile_key_version     = 9;
}

message GetUserProfilesRequest {
  repeated string user_ids = 1;
}

message UserProfile {
  string user_id                = 1;
  bytes  encrypted_display_name = 2;
  bytes  encrypted_bio          = 3;
  bytes  encrypted_avatar_url   = 4;
  // Plaintext CDN URL, transitional. The avatar image is fetched from here;
  // its bytes are not sensitive the way the display name is. Prefer
  // encrypted_avatar_url once the peer's Profile Key is known.
  string avatar_url             = 5;
  bytes  profile_key_version    = 6;
}

message GetUserProfilesResponse {
  repeated UserProfile profiles = 1;
}

message ToggleSanchrModeRequest {
  bool enabled = 1;
}

message SetRegistrationLockRequest {
  bool enabled = 1;
  string pin = 2;
  // Required when replacing an existing PIN: the PIN currently in force.
  // Changing the lock must prove knowledge of the old PIN, not merely that the
  // session is authenticated, so a stolen unlocked device cannot silently
  // re-key the lock that exists to survive exactly that situation. Empty when
  // enabling for the first time.
  string current_pin = 3;
}

message SetRegistrationLockResponse {
  bool success = 1;
}

message GetStorageUsageRequest {}

message StorageUsageResponse {
  int64 photos_bytes = 1;
  int64 videos_bytes = 2;
  int64 documents_bytes = 3;
  int64 voice_bytes = 4;
  int64 other_bytes = 5;
  int64 total_bytes = 6;
  int64 limit_bytes = 7;
}
