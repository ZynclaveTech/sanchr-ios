syntax = "proto3";
package sanchr.keys;

service KeyService {
  rpc UploadKeyBundle(KeyBundle) returns (UploadKeyBundleResponse);
  rpc GetPreKeyBundle(GetPreKeyBundleRequest) returns (PreKeyBundleResponse);
  rpc UploadOneTimePreKeys(UploadOneTimePreKeysRequest) returns (PreKeyCountResponse);
  rpc GetPreKeyCount(GetPreKeyCountRequest) returns (PreKeyCountResponse);
  rpc GetUserDevices(GetUserDevicesRequest) returns (GetUserDevicesResponse);
  rpc RemoveDevice(RemoveDeviceRequest) returns (RemoveDeviceResponse);
  // The identity key published for one device, and nothing else.
  //
  // A client that needs to check "is this the key the server has for that
  // user?" had only GetPreKeyBundle to ask, which hands out — and so spends —
  // one of the user's one-time pre-keys every time. That made a question
  // anyone can trigger into a way of draining someone else's pre-keys.
  rpc GetIdentityKey(GetIdentityKeyRequest) returns (GetIdentityKeyResponse);
}

message SignedPreKey {
  int32 key_id = 1;
  bytes public_key = 2;
  bytes signature = 3;
  int64 timestamp = 4;
}

message OneTimePreKey {
  int32 key_id = 1;
  bytes public_key = 2;
}

message KyberPreKey {
  int32 key_id = 1;
  bytes public_key = 2;
  bytes signature = 3;
  int64 timestamp = 4;
}

message KeyBundle {
  bytes identity_public_key = 1;
  SignedPreKey signed_pre_key = 2;
  repeated OneTimePreKey one_time_pre_keys = 3;
  int32 registration_id = 4;
  int32 device_id = 5;
  KyberPreKey kyber_pre_key = 6;
}

message UploadKeyBundleResponse {}

message GetPreKeyBundleRequest {
  string user_id = 1;
  int32 device_id = 2;
  // Ask for the bundle with no one-time pre-key in it. Nothing is taken from
  // the target, so the response's one_time_pre_key is always absent.
  //
  // For a caller that starts a fresh session often and does not need what a
  // one-time key adds — call setup on iOS, which opens a new session with
  // each of the callee's devices before every call. Taking a one-time key
  // each time let a run of calls empty the callee's supply.
  bool without_one_time_pre_key = 3;
}

message PreKeyBundleResponse {
  bytes identity_public_key = 1;
  SignedPreKey signed_pre_key = 2;
  OneTimePreKey one_time_pre_key = 3;
  int32 device_id = 4;
  int32 registration_id = 5;
  KyberPreKey kyber_pre_key = 6;
}

message GetIdentityKeyRequest {
  string user_id = 1;
  int32 device_id = 2;
}

message GetIdentityKeyResponse {
  bytes identity_public_key = 1;
}

message UploadOneTimePreKeysRequest {
  repeated OneTimePreKey keys = 1;
}

message PreKeyCountResponse {
  int32 count = 1;
}

message GetPreKeyCountRequest {}

message GetUserDevicesRequest {
  string user_id = 1;
}

message GetUserDevicesResponse {
  repeated DeviceInfo devices = 1;
}

message DeviceInfo {
  int32 device_id = 1;
  string platform = 2;
  bool supports_delivery_ack = 3;
  bool key_capable = 4;
  int64 last_active_at = 5;
}

message RemoveDeviceRequest {
  int32 device_id = 1;
}

message RemoveDeviceResponse {
  bool success = 1;
}
