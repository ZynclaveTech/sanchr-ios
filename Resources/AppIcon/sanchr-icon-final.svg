<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dark background — lifted -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2E"/>
      <stop offset="50%" stop-color="#1C2540"/>
      <stop offset="100%" stop-color="#252E4A"/>
    </linearGradient>

    <!-- Rich S-path gradient: teal → indigo → purple -->
    <linearGradient id="sGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="80%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Protective ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Teal endpoint radial glow -->
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple endpoint radial glow -->
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Center node radial glow -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Path ambient glow -->
    <filter id="pathGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Endpoint node glow -->
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Subtle ambient highlight in upper area -->
  <radialGradient id="ambientLight" cx="40%" cy="35%" r="50%">
    <stop offset="0%" stop-color="#2A3555" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#141B2E" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#ambientLight)"/>

  <g transform="translate(512, 512)">

    <!-- E2EE protective ring — subtle dashed circle -->
    <circle cx="0" cy="0" r="335" fill="none" stroke="url(#ringGrad)" stroke-width="1.2"
            stroke-dasharray="10 7" opacity="0.5"/>

    <!-- Faint background mesh (network feel) -->
    <g opacity="0.04" stroke="#6366F1" stroke-width="1">
      <line x1="-280" y1="-180" x2="180" y2="-120"/>
      <line x1="-180" y1="280" x2="80" y2="-180"/>
      <line x1="280" y1="180" x2="-80" y2="80"/>
      <line x1="-240" y1="40" x2="240" y2="-40"/>
    </g>

    <!-- Endpoint glow halos -->
    <circle cx="130" cy="-270" r="70" fill="url(#glowTeal)"/>
    <circle cx="-130" cy="270" r="70" fill="url(#glowPurple)"/>
    <circle cx="0" cy="0" r="55" fill="url(#glowCenter)"/>

    <!-- Subtle network cross-links behind path -->
    <line x1="130" y1="-270" x2="-170" y2="-75" stroke="#22D3EE" stroke-width="1.2" opacity="0.1"/>
    <line x1="130" y1="-270" x2="0" y2="0" stroke="#22D3EE" stroke-width="1" opacity="0.06"/>
    <line x1="-130" y1="270" x2="170" y2="75" stroke="#A855F7" stroke-width="1.2" opacity="0.1"/>
    <line x1="-130" y1="270" x2="0" y2="0" stroke="#A855F7" stroke-width="1" opacity="0.06"/>
    <line x1="-170" y1="-75" x2="0" y2="0" stroke="#6366F1" stroke-width="1" opacity="0.12"/>
    <line x1="170" y1="75" x2="0" y2="0" stroke="#A78BFA" stroke-width="1" opacity="0.12"/>

    <!-- Main S-curve — bold with glow -->
    <path d="M 130,-270
             C -120,-275 -230,-170 -170,-75
             C -110,20 110,-20 170,75
             C 230,170 120,275 -130,270"
          fill="none" stroke="url(#sGrad)" stroke-width="42"
          stroke-linecap="round" filter="url(#pathGlow)"/>

    <!-- Thin inner highlight for glass/depth feel -->
    <path d="M 130,-270
             C -120,-275 -230,-170 -170,-75
             C -110,20 110,-20 170,75
             C 230,170 120,275 -130,270"
          fill="none" stroke="white" stroke-width="2.5"
          stroke-linecap="round" opacity="0.1"/>

    <!-- PERSON: Top endpoint (sender) — head + shoulders silhouette -->
    <g transform="translate(130, -270)" filter="url(#nodeGlow)">
      <circle r="38" fill="#06B6D4" opacity="0.35"/>
      <!-- Head -->
      <circle cy="-12" r="13" fill="white" opacity="0.92"/>
      <!-- Shoulders/body arc -->
      <path d="M -18,6 Q -18,20 0,22 Q 18,20 18,6" fill="white" opacity="0.85"/>
    </g>

    <!-- PERSON: Upper curve (small, subtle) -->
    <g transform="translate(-185, -170)" opacity="0.6">
      <circle cy="-6" r="6" fill="#38BDF8"/>
      <path d="M -8,2 Q -8,10 0,11 Q 8,10 8,2" fill="#38BDF8"/>
    </g>

    <!-- PERSON: Left inflection (medium) -->
    <g transform="translate(-170, -75)" opacity="0.8">
      <circle cy="-9" r="9" fill="#6366F1"/>
      <path d="M -12,2 Q -12,14 0,15 Q 12,14 12,2" fill="#6366F1"/>
    </g>

    <!-- PERSON: Center (you — the user) — largest, prominent -->
    <g transform="translate(0, 0)">
      <circle r="42" fill="white" opacity="0.12"/>
      <!-- Head -->
      <circle cy="-13" r="14" fill="white" opacity="0.95"/>
      <!-- Shoulders -->
      <path d="M -20,5 Q -20,22 0,24 Q 20,22 20,5" fill="white" opacity="0.88"/>
      <!-- Inner accent -->
      <circle cy="-13" r="7" fill="#6366F1" opacity="0.5"/>
    </g>

    <!-- PERSON: Right inflection (medium) -->
    <g transform="translate(170, 75)" opacity="0.8">
      <circle cy="-9" r="9" fill="#A855F7"/>
      <path d="M -12,2 Q -12,14 0,15 Q 12,14 12,2" fill="#A855F7"/>
    </g>

    <!-- PERSON: Lower curve (small, subtle) -->
    <g transform="translate(185, 170)" opacity="0.6">
      <circle cy="-6" r="6" fill="#C084FC"/>
      <path d="M -8,2 Q -8,10 0,11 Q 8,10 8,2" fill="#C084FC"/>
    </g>

    <!-- PERSON: Bottom endpoint (receiver) — head + shoulders silhouette -->
    <g transform="translate(-130, 270)" filter="url(#nodeGlow)">
      <circle r="38" fill="#A855F7" opacity="0.35"/>
      <!-- Head -->
      <circle cy="-12" r="13" fill="white" opacity="0.92"/>
      <!-- Shoulders/body arc -->
      <path d="M -18,6 Q -18,20 0,22 Q 18,20 18,6" fill="white" opacity="0.85"/>
    </g>
  </g>
</svg>