<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deeper, richer dark background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1A"/>
      <stop offset="100%" stop-color="#1A1F35"/>
    </linearGradient>

    <!-- S-path gradient: teal to violet -->
    <linearGradient id="sGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Top node glow -->
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom node glow -->
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Center node glow -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft ambient glow filter -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Larger glow for endpoint nodes -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Subtle radial vignette highlight -->
  <radialGradient id="vignette" cx="45%" cy="42%" r="55%">
    <stop offset="0%" stop-color="#1E293B" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#0B0F1A" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#vignette)"/>

  <g transform="translate(512, 512)">

    <!-- Background glow halos on endpoints -->
    <circle cx="120" cy="-280" r="80" fill="url(#glowTeal)" opacity="0.5"/>
    <circle cx="-120" cy="280" r="80" fill="url(#glowPurple)" opacity="0.5"/>
    <circle cx="0" cy="0" r="60" fill="url(#glowCenter)" opacity="0.35"/>

    <!-- Subtle network cross-links (behind main path) -->
    <line x1="120" y1="-280" x2="-160" y2="-80" stroke="#22D3EE" stroke-width="1.5" opacity="0.12"/>
    <line x1="120" y1="-280" x2="0" y2="0" stroke="#22D3EE" stroke-width="1.5" opacity="0.08"/>
    <line x1="-120" y1="280" x2="160" y2="80" stroke="#A855F7" stroke-width="1.5" opacity="0.12"/>
    <line x1="-120" y1="280" x2="0" y2="0" stroke="#A855F7" stroke-width="1.5" opacity="0.08"/>
    <line x1="-180" y1="-180" x2="0" y2="0" stroke="#818CF8" stroke-width="1.5" opacity="0.1"/>
    <line x1="180" y1="180" x2="0" y2="0" stroke="#818CF8" stroke-width="1.5" opacity="0.1"/>

    <!-- Main S-curve path -->
    <path d="M 120,-280
             C -140,-280 -240,-180 -180,-80
             C -120,20 120,-20 180,80
             C 240,180 140,280 -120,280"
          fill="none" stroke="url(#sGrad)" stroke-width="40"
          stroke-linecap="round" filter="url(#ambientGlow)"/>

    <!-- Secondary thinner parallel path for depth -->
    <path d="M 120,-280
             C -140,-280 -240,-180 -180,-80
             C -120,20 120,-20 180,80
             C 240,180 140,280 -120,280"
          fill="none" stroke="white" stroke-width="2"
          stroke-linecap="round" opacity="0.15"/>

    <!-- Node: Top (sender origin) -->
    <circle cx="120" cy="-280" r="30" fill="#22D3EE" filter="url(#nodeGlow)"/>
    <circle cx="120" cy="-280" r="14" fill="white" opacity="0.9"/>

    <!-- Node: Upper curve -->
    <circle cx="-180" cy="-180" r="14" fill="#38BDF8" opacity="0.75"/>
    <circle cx="-180" cy="-180" r="7" fill="white" opacity="0.5"/>

    <!-- Node: Left inflection -->
    <circle cx="-160" cy="-80" r="18" fill="#818CF8" opacity="0.85"/>
    <circle cx="-160" cy="-80" r="8" fill="white" opacity="0.5"/>

    <!-- Node: Center (you — the user) -->
    <circle cx="0" cy="0" r="24" fill="white" opacity="0.95"/>
    <circle cx="0" cy="0" r="12" fill="#818CF8" opacity="0.8"/>

    <!-- Node: Right inflection -->
    <circle cx="160" cy="80" r="18" fill="#A78BFA" opacity="0.85"/>
    <circle cx="160" cy="80" r="8" fill="white" opacity="0.5"/>

    <!-- Node: Lower curve -->
    <circle cx="180" cy="180" r="14" fill="#C084FC" opacity="0.75"/>
    <circle cx="180" cy="180" r="7" fill="white" opacity="0.5"/>

    <!-- Node: Bottom (receiver destination) -->
    <circle cx="-120" cy="280" r="30" fill="#A855F7" filter="url(#nodeGlow)"/>
    <circle cx="-120" cy="280" r="14" fill="white" opacity="0.9"/>
  </g>
</svg>