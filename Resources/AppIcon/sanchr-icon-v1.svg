<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1A8A"/>
      <stop offset="50%" stop-color="#6B2FB5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Accent glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Connected path gradient -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0D0FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#glow)"/>

  <!-- Connected S: Two interlocking speech-bubble/chain links forming an S -->
  <g transform="translate(512, 512)" fill="none" stroke="url(#pathGrad)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper arc of S — opens left like a speech bubble -->
    <path d="M 100,-280 C -180,-280 -260,-140 -160,-40" opacity="0.95"/>

    <!-- Middle connecting bridge -->
    <path d="M -160,-40 C -60,60 60,60 160,40" opacity="0.95"/>

    <!-- Lower arc of S — opens right like a speech bubble -->
    <path d="M 160,40 C 260,140 180,280 -100,280" opacity="0.95"/>

    <!-- Connection nodes (dots at endpoints) -->
    <circle cx="100" cy="-280" r="28" fill="#E0D0FF" stroke="none"/>
    <circle cx="-100" cy="280" r="28" fill="#FFFFFF" stroke="none"/>

    <!-- Small link nodes along the path for "connected" feel -->
    <circle cx="-200" cy="-160" r="16" fill="#C4B5FD" stroke="none" opacity="0.8"/>
    <circle cx="-140" cy="-40" r="18" fill="#DDD6FE" stroke="none" opacity="0.9"/>
    <circle cx="160" cy="40" r="18" fill="#DDD6FE" stroke="none" opacity="0.9"/>
    <circle cx="200" cy="160" r="16" fill="#C4B5FD" stroke="none" opacity="0.8"/>
  </g>
</svg>