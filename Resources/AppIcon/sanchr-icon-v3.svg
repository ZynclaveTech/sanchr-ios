<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Teal/cyan accent -->
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark slate background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg3)"/>

  <!-- Network/constellation S -->
  <g transform="translate(512, 512)" filter="url(#softGlow)">

    <!-- S-curve flowing path -->
    <path d="M 140,-300 C -160,-300 -240,-180 -180,-80
             C -120,20 120,20 180,80
             C 240,180 160,300 -140,300"
          fill="none" stroke="url(#teal)" stroke-width="36"
          stroke-linecap="round" opacity="0.9"/>

    <!-- Connection nodes along the S — like a network graph -->
    <!-- Top node -->
    <circle cx="140" cy="-300" r="32" fill="#06B6D4" opacity="0.95"/>
    <circle cx="140" cy="-300" r="44" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.3"/>

    <!-- Upper-left curve node -->
    <circle cx="-200" cy="-180" r="22" fill="#22D3EE" opacity="0.85"/>

    <!-- Center-left node -->
    <circle cx="-180" cy="-80" r="26" fill="#A78BFA" opacity="0.9"/>

    <!-- Center node — the heart of the connection -->
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" opacity="0.95"/>

    <!-- Center-right node -->
    <circle cx="180" cy="80" r="26" fill="#A78BFA" opacity="0.9"/>

    <!-- Lower-right curve node -->
    <circle cx="200" cy="180" r="22" fill="#22D3EE" opacity="0.85"/>

    <!-- Bottom node -->
    <circle cx="-140" cy="300" r="32" fill="#8B5CF6" opacity="0.95"/>
    <circle cx="-140" cy="300" r="44" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.3"/>

    <!-- Subtle cross-connections (network feel) -->
    <line x1="-200" y1="-180" x2="-180" y2="-80" stroke="#22D3EE" stroke-width="3" opacity="0.25"/>
    <line x1="-180" y1="-80" x2="0" y2="0" stroke="#A78BFA" stroke-width="3" opacity="0.25"/>
    <line x1="0" y1="0" x2="180" y2="80" stroke="#A78BFA" stroke-width="3" opacity="0.25"/>
    <line x1="180" y1="80" x2="200" y2="180" stroke="#22D3EE" stroke-width="3" opacity="0.25"/>

    <!-- Diagonal cross-links for network density -->
    <line x1="140" y1="-300" x2="-180" y2="-80" stroke="#06B6D4" stroke-width="2" opacity="0.15"/>
    <line x1="180" y1="80" x2="-140" y2="300" stroke="#8B5CF6" stroke-width="2" opacity="0.15"/>
  </g>
</svg>